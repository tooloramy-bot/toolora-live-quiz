
name = "toolora-live-quiz"
main = "src/index.ts"
account_id = "f4aa1349d769d86f9f1349b039f95364"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "GAME_ROOM"
